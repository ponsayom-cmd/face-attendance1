<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Settings</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 450px; }
    h2 { margin-top: 0; text-align: center; }
    label { display: block; margin: 15px 0 5px; font-size: 0.85rem; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-add { background: #6366f1; color: white; width: auto; padding: 12px 20px; margin: 0; }
    .btn-save { background: #10b981; color: white; font-size: 1.1rem; }
    .subject-list { background: #0f172a; border-radius: 10px; padding: 10px; min-height: 80px; border: 1px solid #334155; margin-top: 5px; }
    .subject-item { display: flex; justify-content: space-between; padding: 8px 10px; background: #1e293b; border-radius: 6px; margin-bottom: 5px; }
    .btn-del { color: #f87171; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚙️ ตั้งค่ารายวิชา</h2>
    
    <label>Google Script API URL</label>
    <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/...">

    <div style="border-top: 1px solid #334155; margin: 25px 0;"></div>

    <label>เพิ่มรายวิชาใหม่</label>
    <div class="btn-group">
      <input type="text" id="subjectInp" placeholder="ชื่อรายวิชา">
      <button class="btn-add" onclick="addSubject()">เพิ่ม</button>
    </div>

    <label>รายการวิชาที่มีในระบบ</label>
    <div class="subject-list" id="subjectList"></div>

    <button class="btn btn-save" onclick="saveSettings()">💾 บันทึกข้อมูลลงฐานข้อมูล</button>
    
    <a href="report.html" style="display:block; text-align:center; margin-top:20px; color:#94a3b8; text-decoration:none;">🔙 กลับหน้าหลัก</a>
  </div>

  <script>
    if(sessionStorage.getItem('isAdmin') !== 'true') window.location.href = 'login.html';
    let subjects = [];

    window.onload = async () => {
      const savedUrl = localStorage.getItem('gasApiUrl');
      if(savedUrl) {
        document.getElementById('apiUrl').value = savedUrl;
        const res = await fetch(`${savedUrl}?action=getConfig`);
        const data = await res.json();
        subjects = data.subjects || [];
        render();
      }
    };

    function addSubject() {
      const inp = document.getElementById('subjectInp');
      if(inp.value.trim() && !subjects.includes(inp.value.trim())) {
        subjects.push(inp.value.trim());
        inp.value = '';
        render();
      }
    }

    function remove(idx) {
      subjects.splice(idx, 1);
      render();
    }

    function render() {
      const list = document.getElementById('subjectList');
      if(subjects.length === 0) { list.innerHTML = '<p style="color:#475569; text-align:center">ยังไม่มีวิชา</p>'; return; }
      list.innerHTML = subjects.map((s, i) => `
        <div class="subject-item">
          <span>${s}</span>
          <span class="btn-del" onclick="remove(${i})">✕ ลบ</span>
        </div>
      `).join('');
    }

    async function saveSettings() {
      const url = document.getElementById('apiUrl').value.trim();
      if(!url) return alert('กรุณาใส่ API URL');
      localStorage.setItem('gasApiUrl', url);

      try {
        await fetch(url, { method: 'POST', body: JSON.stringify({
          action: 'saveConfig', subjects: subjects
        })});
        alert('บันทึกสำเร็จ!');
      } catch (e) {
        alert('บันทึกล้มเหลว ตรวจสอบ URL');
      }
    }
  </script>
</body>
</html>
