<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการข้อมูลนักเรียน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --danger: #f87171;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body { 
      font-family: 'Sarabun', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0;
      padding: 0;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh;
    }

    /* Navigation Bar */
    .nav-bar {
      width: 100%;
      background: var(--card-bg);
      padding: 15px 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: bold;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text);
    }

    .container { 
      width: 95%; 
      max-width: 900px; 
      padding: 30px 10px; 
    }

    .header-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .content-card { 
      background: var(--card-bg); 
      padding: 25px; 
      border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 20px; 
      background: var(--bg); 
      border-radius: 15px; 
      overflow: hidden; 
    }

    th, td { 
      padding: 15px; 
      text-align: left; 
      border-bottom: 1px solid #334155; 
    }

    th { 
      background: #334155; 
      color: var(--text-muted); 
      font-size: 0.85rem; 
      text-transform: uppercase; 
    }

    tr:hover { background: rgba(255,255,255,0.02); }

    .btn-del { 
      background: var(--danger); 
      color: white; 
      border: none; 
      padding: 8px 15px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.85rem; 
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-del:hover { background: #ef4444; transform: scale(1.05); }

    .status-badge { 
      background: #10b981; 
      color: white; 
      padding: 4px 10px; 
      border-radius: 6px; 
      font-size: 0.75rem; 
      font-weight: bold;
    }

    .loader { text-align: center; padding: 50px; color: var(--text-muted); }
    
    .footer-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
      margin-bottom: 50px;
    }

    .btn-back {
      padding: 10px 20px;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .btn-back:hover {
      background: rgba(255,255,255,0.1);
      color: white;
      border-color: white;
    }
  </style>
</head>
<body>

  <!-- แถบเมนูด้านบน -->
  <nav class="nav-bar">
    <a href="index.html" class="nav-link">🏠 หน้าหลัก</a>
    <a href="report.html" class="nav-link">📊 รายงาน</a>
    <a href="manage-students.html" class="nav-link active">👥 จัดการนักเรียน</a>
    <a href="config.html" class="nav-link">⚙️ ตั้งค่า</a>
  </nav>

  <div class="container">
    <div class="header-section">
      <h1>👥 จัดการข้อมูลนักเรียน</h1>
      <p style="color: var(--text-muted);">ตรวจสอบรายชื่อและลบข้อมูลนักเรียนที่ลงทะเบียนไว้ในระบบ</p>
    </div>
    
    <div class="content-card">
      <div id="content">
        <div class="loader">⏳ กำลังโหลดรายชื่อนักเรียน...</div>
      </div>
    </div>

    <!-- ปุ่มย้อนกลับด้านล่าง -->
    <div class="footer-actions">
      <a href="index.html" class="btn-back">🔙 ย้อนกลับหน้าหลัก</a>
    </div>
  </div>

  <script>
    // ตรวจสอบสิทธิ์ (ถ้าจำเป็น)
    // if (sessionStorage.getItem('isAdmin') !== 'true') window.location.href = 'login.html';
    
    const API_URL = localStorage.getItem('gasApiUrl');

    window.onload = loadStudents;

    async function loadStudents() {
      const content = document.getElementById('content');
      if (!API_URL) {
        content.innerHTML = '<div class="loader" style="color:var(--danger);">❌ ไม่พบ API URL กรุณาตั้งค่าในหน้า Config</div>';
        return;
      }

      try {
        const res = await fetch(`${API_URL}?action=getKnownFaces`);
        const data = await res.json();
        
        if (!data || data.length === 0) {
          content.innerHTML = '<div class="loader">❌ ยังไม่มีนักเรียนลงทะเบียนในระบบ</div>';
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>ชื่อ-นามสกุล</th>
                <th>วันที่ลงทะเบียน</th>
                <th>สถานะใบหน้า</th>
                <th>จัดการ</th>
              </tr>
            </thead>
            <tbody>
        `;

        data.forEach(student => {
          html += `
            <tr>
              <td style="font-weight: bold;">${student.name}</td>
              <td style="font-size: 0.85rem; color: var(--text-muted);">${student.regDate || '-'}</td>
              <td><span class="status-badge">✅ พร้อมใช้งาน</span></td>
              <td>
                <button class="btn-del" onclick="deleteStudent('${student.name}')">🗑️ ลบ</button>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        content.innerHTML = html;

      } catch (e) {
        content.innerHTML = '<div class="loader" style="color:var(--danger);">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
      }
    }

    async function deleteStudent(name) {
      if (!confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลของ "${name}"?\nการกระทำนี้ไม่สามารถย้อนกลับได้`)) return;
      
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'deleteStudent', name: name })
        });
        const result = await res.json();
        
        if (result.success) {
          alert('ลบข้อมูลนักเรียนเรียบร้อยแล้ว');
          loadStudents(); // รีโหลดข้อมูลใหม่
        } else {
          alert('ไม่สามารถลบข้อมูลได้: ' + result.message);
        }
      } catch (e) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
      }
    }
  </script>
</body>
</html>
