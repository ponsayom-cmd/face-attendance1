<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สแกนใบหน้าเข้าเรียน</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .scan-container { width: 100%; max-width: 500px; background: #1e293b; padding: 20px; border-radius: 20px; text-align: center; }
    video { width: 100%; border-radius: 15px; transform: scaleX(-1); border: 3px solid #334155; }
    #status { margin: 15px 0; font-weight: bold; color: #fbbf24; }
    select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; background: #0f172a; color: white; border: 1px solid #334155; }
    .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
    .btn:disabled { background: #475569; }
  </style>
</head>
<body>
  <div class="scan-container">
    <h2>📸 เช็คชื่อเข้าเรียน</h2>
    <select id="subSelect"><option value="">⏳ กำลังโหลดวิชา...</option></select>
    <video id="video" autoplay muted playsinline></video>
    <div id="status">⏳ กำลังเตรียมระบบ AI...</div>
    <button id="btnStart" class="btn" onclick="startCamera()">เริ่มสแกน</button>
  </div>

  <script>
    const API_URL = localStorage.getItem('gasApiUrl');
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    let faceMatcher = null;
    let isProcessing = false;

    window.onload = async () => {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      
      const res = await fetch(`${API_URL}?action=getSubjects`);
      const subs = await res.json();
      document.getElementById('subSelect').innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
      status.innerText = "✅ AI พร้อมทำงาน";
    };

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
      video.srcObject = stream;
      status.innerText = "⏳ กำลังโหลดฐานข้อมูลใบหน้า...";
      
      const res = await fetch(`${API_URL}?action=getKnownFaces`);
      const data = await res.json();
      
      if (data.length === 0) return alert('ยังไม่มีข้อมูลนักเรียน');

      const labeledDescriptors = data.map(d => {
        return new faceapi.LabeledFaceDescriptors(d.name, [new Float32Array(d.descriptor)]);
      });

      // ตั้ง Threshold ที่ 0.4 (ยิ่งน้อยยิ่งเข้มงวด ป้องกันการสแกนผิดคน)
      faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.4);
      status.innerText = "🔍 กำลังค้นหาใบหน้าของคุณ...";
      detect();
    }

    async function detect() {
      if (isProcessing) return;
      const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
      
      if (detection) {
        const match = faceMatcher.findBestMatch(detection.descriptor);
        if (match.label !== 'unknown') {
          isProcessing = true;
          status.innerText = `🎉 พบข้อมูล: ${match.label}`;
          saveAttendance(match.label);
          return;
        } else {
          status.innerText = "❌ ไม่พบใบหน้าในระบบ";
        }
      }
      setTimeout(detect, 500);
    }

    async function saveAttendance(name) {
      const sub = document.getElementById('subSelect').value;
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'logAttendance', name: name, subject: sub })
      });
      alert(`เช็คชื่อสำเร็จ: ${name}\nวิชา: ${sub}`);
      window.location.reload();
    }
  </script>
</body>
</html>
