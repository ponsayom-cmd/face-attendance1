<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สรุปรายงานการเข้าเรียน</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 900px; background: #1e293b; padding: 20px; border-radius: 20px; }
    .card { background: #0f172a; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-item { text-align: center; padding: 15px; border-radius: 10px; background: #1e293b; }
    .label { font-size: 0.8rem; color: #94a3b8; }
    .value { font-size: 1.5rem; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; font-size: 0.8rem; color: #94a3b8; }
    .text-present { color: #10b981; }
    .text-absent { color: #f87171; }
    .filter-box { display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-end; }
    select, input { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
    button { padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📊 รายงานสถิติ</h2>
    
    <div class="filter-box">
      <div>
        <div class="label">วันที่</div>
        <input type="date" id="dateInput">
      </div>
      <div>
        <div class="label">รายวิชา</div>
        <select id="subjectSelect"><option>โหลดวิชา...</option></select>
      </div>
      <button onclick="loadReport()">🔍 ค้นหา</button>
    </div>

    <div class="grid">
      <div class="stat-item">
        <div class="label">ทั้งหมด</div>
        <div class="value" id="vTotal">0</div>
      </div>
      <div class="stat-item">
        <div class="label text-present">มาเรียน</div>
        <div class="value text-present" id="vPresent">0</div>
      </div>
      <div class="stat-item">
        <div class="label text-absent">ขาดเรียน</div>
        <div class="value text-absent" id="vAbsent">0</div>
      </div>
    </div>

    <div class="card">
      <h3 class="text-present">✅ รายชื่อนักเรียนที่มาเรียน</h3>
      <table id="presentTable">
        <thead><tr><th>ชื่อ</th><th>เวลาสแกน</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h3 class="text-absent">❌ รายชื่อนักเรียนที่ขาดเรียน</h3>
      <table id="absentTable">
        <thead><tr><th>ชื่อ</th><th>สถานะ</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = localStorage.getItem('gasApiUrl');

    window.onload = async () => {
      document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
      const res = await fetch(`${API_URL}?action=getSubjects`);
      const subs = await res.json();
      document.getElementById('subjectSelect').innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
    };

    async function loadReport() {
      const date = document.getElementById('dateInput').value;
      const sub = document.getElementById('subjectSelect').value;
      
      const res = await fetch(`${API_URL}?action=getAttendanceReport&date=${date}&subject=${encodeURIComponent(sub)}`);
      const data = await res.json();

      document.getElementById('vTotal').innerText = data.stats.total;
      document.getElementById('vPresent').innerText = data.stats.present;
      document.getElementById('vAbsent').innerText = data.stats.absent;

      // ตารางคนมา
      const pBody = document.querySelector('#presentTable tbody');
      pBody.innerHTML = data.attendance.length ? data.attendance.map(i => `<tr><td>${i.name}</td><td>${i.time}</td></tr>`).join('') : '<tr><td colspan="2">ไม่มีข้อมูล</td></tr>';

      // ตารางคนขาด
      const aBody = document.querySelector('#absentTable tbody');
      aBody.innerHTML = data.absentList.length ? data.absentList.map(name => `<tr><td>${name}</td><td class="text-absent">ขาดเรียน</td></tr>`).join('') : '<tr><td colspan="2">ไม่มีคนขาดเรียน</td></tr>';
    }
  </script>
</body>
</html>
