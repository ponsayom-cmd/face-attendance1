<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบจัดการ Admin และนักเรียน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #6366f1; --danger: #f87171; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
    body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
    
    .nav-bar { background: var(--card-bg); padding: 15px; display: flex; justify-content: center; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; }
    .nav-link { color: #94a3b8; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
    .nav-link.active { color: white; border-bottom: 2px solid var(--primary); }

    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 15px; background: var(--card-bg); border: none; color: white; cursor: pointer; border-radius: 10px; font-weight: bold; }
    .tab-btn.active { background: var(--primary); }

    .card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; }
    .card.active { display: block; }

    .form-group { margin-bottom: 15px; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
    .btn-add { padding: 10px 20px; background: var(--primary); border: none; color: white; border-radius: 8px; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; color: #94a3b8; font-size: 0.85rem; }
    .btn-del { background: var(--danger); border: none; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link">🏠 หน้าหลัก</a>
    <a href="report.html" class="nav-link">📊 รายงาน</a>
    <a href="manage-admin.html" class="nav-link active">🛡️ จัดการระบบ</a>
    <a href="config.html" class="nav-link">⚙️ ตั้งค่า</a>
  </nav>

  <div class="container">
    <h1>🛡️ ระบบจัดการหลังบ้าน</h1>
    
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('adminTab', this)">🔑 จัดการ Admin</button>
      <button class="tab-btn" onclick="showTab('studentTab', this)">👥 จัดการนักเรียน</button>
    </div>

    <!-- ส่วนจัดการ Admin -->
    <div id="adminTab" class="card active">
      <h3>➕ เพิ่ม Admin ใหม่</h3>
      <div class="form-group">
        <input type="text" id="admUser" placeholder="Username">
        <input type="password" id="admPass" placeholder="Password">
        <button class="btn-add" onclick="handleAddAdmin()">เพิ่ม</button>
      </div>
      <hr style="border-color: #334155;">
      <h3>📋 รายชื่อผู้ดูแลระบบ</h3>
      <table id="adminTable">
        <thead><tr><th>Username</th><th>จัดการ</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- ส่วนจัดการนักเรียน -->
    <div id="studentTab" class="card">
      <h3>📋 รายชื่อนักเรียนทั้งหมด</h3>
      <table id="studentTable">
        <thead><tr><th>ชื่อ-นามสกุล</th><th>วันที่ลงทะเบียน</th><th>จัดการ</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = localStorage.getItem('gasApiUrl');

    function showTab(tabId, btn) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      if(tabId === 'adminTab') loadAdmins();
      else loadStudents();
    }

    async function loadAdmins() {
      const tbody = document.querySelector('#adminTable tbody');
      tbody.innerHTML = '<tr><td colspan="2">⏳ โหลดข้อมูล...</td></tr>';
      try {
        const res = await fetch(`${API_URL}?action=getAdmins`);
        const data = await res.json();
        tbody.innerHTML = data.map(a => `
          <tr>
            <td>${a.username}</td>
            <td><button class="btn-del" onclick="deleteAdmin('${a.username}')">🗑️ ลบ</button></td>
          </tr>
        `).join('');
      } catch (e) { tbody.innerHTML = '<tr><td colspan="2">❌ ผิดพลาด</td></tr>'; }
    }

    async function handleAddAdmin() {
      const u = document.getElementById('admUser').value;
      const p = document.getElementById('admPass').value;
      if(!u || !p) return alert('กรุณากรอกข้อมูลให้ครบ');
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'addAdmin', username: u, password: p })
      });
      const data = await res.json();
      if(data.success) { alert('เพิ่มสำเร็จ'); loadAdmins(); }
      else alert(data.message);
    }

    async function deleteAdmin(u) {
      if(!confirm(`ลบ Admin: ${u}?`)) return;
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteAdmin', username: u })
      });
      const data = await res.json();
      if(data.success) loadAdmins();
      else alert(data.message);
    }

    async function loadStudents() {
      const tbody = document.querySelector('#studentTable tbody');
      tbody.innerHTML = '<tr><td colspan="3">⏳ โหลดข้อมูล...</td></tr>';
      try {
        const res = await fetch(`${API_URL}?action=getKnownFaces`);
        const data = await res.json();
        tbody.innerHTML = data.map(s => `
          <tr>
            <td>${s.name}</td>
            <td>${s.regDate}</td>
            <td><button class="btn-del" onclick="deleteStudent('${s.name}')">🗑️ ลบ</button></td>
          </tr>
        `).join('');
      } catch (e) { tbody.innerHTML = '<tr><td colspan="3">❌ ผิดพลาด</td></tr>'; }
    }

    async function deleteStudent(name) {
      if(!confirm(`ลบนักเรียน: ${name}?`)) return;
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteStudent', name: name })
      });
      const data = await res.json();
      if(data.success) loadStudents();
    }

    window.onload = loadAdmins;
  </script>
</body>
</html>
