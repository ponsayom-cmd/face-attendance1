<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - Face Check-in</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Sarabun', sans-serif; 
      background: #0f172a; 
      color: white; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
    }
    .card { 
      background: #1e293b; 
      padding: 40px; 
      border-radius: 24px; 
      width: 100%; 
      max-width: 400px; 
      text-align: center; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h2 { margin-bottom: 20px; color: #f8fafc; }
    .input-group { text-align: left; margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 0.9rem; }
    input { 
      width: 100%; 
      padding: 14px; 
      border-radius: 12px; 
      border: 1px solid #334155; 
      background: #0f172a; 
      color: white; 
      box-sizing: border-box; 
      font-size: 1rem;
    }
    button { 
      width: 100%; 
      padding: 14px; 
      border-radius: 12px; 
      border: none; 
      background: linear-gradient(135deg, #6366f1, #4f46e5); 
      color: white; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 1rem;
      margin-top: 10px;
      transition: 0.3s;
    }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    .divider { height: 1px; background: #334155; margin: 25px 0; position: relative; }
    .divider::after { content: 'ตั้งค่าระบบ'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 0 10px; color: #475569; font-size: 0.8rem; }
    .api-section { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-top: 10px; }
    .status-msg { margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 เข้าสู่ระบบอาจารย์</h2>
    
    <div class="input-group">
      <label>ชื่อผู้ใช้งาน (Username)</label>
      <input type="text" id="user" placeholder="admin">
    </div>
    
    <div class="input-group">
      <label>รหัสผ่าน (Password)</label>
      <input type="password" id="pass" placeholder="••••••••">
    </div>
    
    <button onclick="login()">เข้าสู่ระบบ</button>
    <div id="loginStatus" class="status-msg"></div>

    <div class="divider"></div>

    <div class="api-section">
      <div class="input-group">
        <label>Google Script API URL</label>
        <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/...">
      </div>
      <p style="font-size: 0.75rem; color: #64748b; margin: 0;">* ใส่ URL ที่ได้จากการ Deploy Google Script</p>
    </div>
    
    <a href="index.html" style="display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem;">🔙 กลับหน้าหลัก</a>
  </div>

  <script>
    // ดึงค่า URL เดิมที่เคยบันทึกไว้ (ถ้ามี)
    window.onload = () => {
      const savedUrl = localStorage.getItem('gasApiUrl');
      if (savedUrl) {
        document.getElementById('apiUrl').value = savedUrl;
      }
    };

    async function login() {
      const status = document.getElementById('loginStatus');
      const url = document.getElementById('apiUrl').value.trim();
      const u = document.getElementById('user').value;
      const p = document.getElementById('pass').value;

      if (!url) {
        status.innerHTML = '<span style="color:#f87171">❌ กรุณากรอก API URL</span>';
        return;
      }

      if (!u || !p) {
        status.innerHTML = '<span style="color:#f87171">❌ กรุณากรอกชื่อผู้ใช้และรหัสผ่าน</span>';
        return;
      }

      // บันทึก URL ลง LocalStorage เผื่อใช้ในหน้าอื่นๆ
      localStorage.setItem('gasApiUrl', url);
      status.innerHTML = '<span style="color:#fbbf24">⏳ กำลังตรวจสอบสิทธิ์...</span>';

      try {
        const res = await fetch(url, { 
          method: 'POST', 
          mode: 'cors',
          body: JSON.stringify({ action: 'login', username: u, password: p }) 
        });
        
        const data = await res.json();
        
        if (data.success) {
          sessionStorage.setItem('isAdmin', 'true');
          status.innerHTML = '<span style="color:#10b981">✅ สำเร็จ! กำลังไปที่หน้ารายงาน...</span>';
          setTimeout(() => {
            window.location.href = 'report.html';
          }, 1000);
        } else {
          status.innerHTML = `<span style="color:#f87171">❌ ${data.message || 'รหัสผ่านผิด'}</span>`;
        }
      } catch (err) {
        status.innerHTML = '<span style="color:#f87171">❌ เชื่อมต่อ API ไม่ได้ ตรวจสอบ URL อีกครั้ง</span>';
        console.error(err);
      }
    }
  </script>
</body>
</html>
