<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #6366f1; color: white; cursor: pointer; font-weight: bold; }
    .status { margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 เข้าสู่ระบบอาจารย์</h2>
    <input type="text" id="apiUrl" placeholder="Google Script API URL">
    <div style="border-top: 1px solid #334155; margin: 15px 0;"></div>
    <input type="text" id="user" placeholder="ชื่อผู้ใช้ (admin)">
    <input type="password" id="pass" placeholder="รหัสผ่าน (1234)">
    <button id="loginBtn" onclick="handleLogin()">เข้าสู่ระบบ</button>
    <div id="status" class="status"></div>
    <a href="index.html" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem; display: block; margin-top: 15px;">🔙 กลับหน้าหลัก</a>
  </div>

  <script>
    window.onload = () => {
      const savedUrl = localStorage.getItem('gasApiUrl');
      if (savedUrl) document.getElementById('apiUrl').value = savedUrl;
    };

    async function handleLogin() {
      const url = document.getElementById('apiUrl').value.trim();
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('loginBtn');

      if (!url || !u || !p) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

      localStorage.setItem('gasApiUrl', url);
      btn.disabled = true;
      status.innerText = "⏳ กำลังตรวจสอบข้อมูล...";

      try {
        const res = await fetch(url, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: u, password: p })
        });
        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('isAdmin', 'true');
          status.innerHTML = "<span style='color:#10b981'>✅ สำเร็จ! กำลังไปที่หน้าจัดการ...</span>";
          setTimeout(() => window.location.href = 'report.html', 1000);
        } else {
          status.innerHTML = "<span style='color:#f87171'>❌ " + (data.message || "รหัสผ่านผิด") + "</span>";
          btn.disabled = false;
        }
      } catch (e) {
        status.innerHTML = "<span style='color:#f87171'>❌ เชื่อมต่อ API ไม่ได้</span>";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
